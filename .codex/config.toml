["tui".presets.1]
input = """
$i-want you to resolve the listed items through delegates, using $commit for all commits.

Main acts as PM and QA; delegates are developers. No review delegates or separate review-only stage.

Every section addresses main except "Delegate brief", which you export once and preload verbatim for each developer.

## Planning and dispatch

* Fetch each item's $plane body, comments, labels, and relevant attachments. Understand the outcome, acceptance, dependencies, and edit overlap. Export the original requirement text verbatim and preload relevant evidence for each developer so it does not fetch it again. Retain these sources for your own QA.

* Settle what available evidence and authorized engineering judgment can answer. Ask me together for remaining user decisions before dispatching affected work; independent settled groups can proceed. Bring proposed scope expansions to me.

* Group tightly coupled items under one developer and run independent groups in parallel. Give each group high-level directions, the existing path to extend, acceptance checks, and a rough size. Name delegates `<category>-<topic>-<id>`, like `sql-syntax_error-456`.

* Give each developer its own worktree per changed repository. Sequence conflicting work when isolation cannot resolve the dependency. Spawn a fresh delegate for every new task; never reuse a delegate for a new task. Follow up with a completed agent only to correct its assigned work.

* Preload the Delegate brief and exported evidence. Spawn messages identify those sources and give assignment-specific directions without repeating their contents.

* Check the evidence behind a delegate's proposed scope change before relaying it to me, and include that evidence in the question.

## Delegate brief

The user explicitly requires the following of you, the developer owning the assigned items.

* Own implementation, tests, validation, self-checks, fixes, and commits with $commit. Main owns acceptance and integration QA; return work directly to main without spawning reviewers.

* Demonstrate how the change meets the original requirements and corrections through affected consumers. For visual changes, supply the rendered result for comparison with the reported state; passing snapshots alone are not proof.

* If work materially outgrows the estimate, reconsider the approach and report the reason and revised size rather than silently expanding it.

* Own intermediate Plane statuses and activity updates, recording the problem, chosen approach, reasons, and result concisely. Correct titles/bodies only from confirmed evidence and assign correct labels. Leave final statuses (Pending QA, Done) to main.

* Hand off briefly with commit SHAs, explicit mchanges IDs/ranges, requirement-to-evidence pointers, checks run, coverage limits, blockers, and integration notes. After follow-ups, return the complete current handoff, not a reference to an earlier one.

## Main acceptance and integration

* As each group returns, inspect its actual changes and affected consumers against the original requirements, corrections, and attachments. Verify that its evidence exercises the reported problem. A handoff or passing test count is not acceptance evidence by itself.

* Check requirement fit, conflicting behavior, duplicated mechanisms, unnecessary complexity, and rendered UI/snapshot regressions. Check cross-group interactions as changes land, including semantic conflicts that merge cleanly. This is your QA responsibility.

* Reuse sound developer validation; run focused checks to close evidence gaps or exercise integration. Integrate accepted groups as they become ready. Consolidate actionable findings for the owner rather than sending piecemeal review rounds.

* Handle small integration fixes, history rewrites, commit wording, few-line corrections, documentation, and owner pointers yourself. Defer edits to files or interfaces a running delegate depends on until its work is integrated.

* Return substantial rework to its owner. If unavailable, start a fresh owner for the same items with its last handoff and your findings. After fixes, revisit changed or unverified behavior, not completed QA of unchanged work.

* Once related groups are integrated, run the full suite on their integrated tree. Reuse completed acceptance and cross-group QA, without a separate final review stage. After corrections, rerun failed and affected checks, retaining unchanged results.

* Independent repositories or follow-ups must not hold a ready batch's delivery. Changes affecting its shared contracts need scoped integration checks. Set each item's final Plane status, Pending QA or Done, after its affected integrated tree passes the suite and your findings are resolved; report remaining coverage limits.

* Wait with wait_agent when no independent work remains. Make no Plane activity updates yourself.

* After final statuses are set, remove task-created worktrees and branches whose patches are integrated, checking with git cherry. Preserve uncommitted or unintegrated work and report it.

## Follow-ups and discovered issues

* Apply Planning and dispatch without restarting unaffected work or completed QA. For a newly reported issue without an item ID, confirm the issue and cause, create an item, then resolve it within the accepted scope.

## Tasks

"""
label = "Orchestrate plane items"

["tui".presets.2]
input = """
$i-want you to sweep the target below for removable complexity, overhead, and avoidable failures, then fix what you confirm. Use $commit for all commits.

## Sweep

* Run the sweep through background subagents, split by area or aspect, so they cover the target in parallel while you continue. Brief them with the target and categories, not your suspicions, so their findings stay independent.

* Look for:

  * Dead code: static dead-code analysis plus code reading for unused or unreachable logic.

  * Stale support: legacy, compatibility, and migration code with no remaining consumer, the docs and tests that exist only for it, and leftovers from earlier removals.

  * Slop: what $deslop targets, in implementations and tests.

  * Overhead in every phase the target runs through (such as setup, run, grading, teardown): CPU, memory, allocations, disk, wall time, and repeated work.

  * Avoidable failures: errors that are handled, retried, or masked when their source could be removed.

* Alongside the code, use any evidence sources the target names, such as agent session transcripts or Plane FIXME items.

## Findings

* Confirm each finding against its callers and contracts, and each overhead finding with a measurement or profile. Drop what you cannot confirm.

* In projects tracked in Plane, record each confirmed finding as its own item with $plane. Record findings outside the target in a FIXME item instead of fixing them.

* If the target says read-only, stop after recording and report.

## Fixes

* Resolve every confirmed in-scope finding in this session.

* Remove before optimizing, so no effort goes into code that is about to go.

* Simplify with $deslop.

* Optimize for lower CPU and memory use, fewer allocations, and no repeated work. Fix an error at its source rather than handling it.

* Report before-and-after measurements for each optimization.

## Target

"""
label = "Sweep, deslop, optimize"

["tui".presets.3]
input = """
$i-want you to diagnose the agent behavior in the evidence below and fix its causes. Use $commit for all commits.

## Diagnose

* Read the named sessions, transcripts, URLs, and reports yourself.

* Trace each symptom, such as stalls, extra requests or tokens, longer wall time, unrequested work, instruction violations, or noisy output, to the cause that produces it: project code, global or project instructions, skills, hooks, or tool output.

* Check other recent sessions for the same causes and for related frictions the evidence did not name.

* Confirm causes with transcript evidence. Keep unconfirmed hypotheses separate.

## Fix

* Fix each confirmed cause at its owner, including preexisting ones, so the symptom cannot recur.

* Record causes outside the target project in a FIXME item.

* Report each symptom with its cause, evidence, and fix.

## Evidence

"""
label = "Diagnose sessions"

