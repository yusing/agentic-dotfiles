"model" = "gpt-6-astra"
"model_reasoning_summary" = "auto"
"model_context_window" = 400000
"personality" = "none"
"plan_mode_reasoning_effort" = "ultra"
"hide_agent_reasoning" = false
"service_tier" = "default"
"approval_policy" = "on-request"
"approvals_reviewer" = "auto_review"
"model_instructions_file" = "$HOME/.codex/overridden_base_instructions.md"
"model_reasoning_effort" = "ultra"
"sandbox_mode" = "danger-full-access"
["skills"]
"include_instructions" = false

["analytics"]
"enabled" = false

["memories"]
"use_memories" = false
"generate_memories" = false

["tui"]
"theme" = "catppuccin-mocha"
"status_line_use_colors" = true
"session_picker_view" = "comfortable"
"status_line" = ["model-with-reasoning", "git-branch", "context-used", "fast-mode", "task-progress", "thread-id", "branch-changes", "weekly-limit", "context-window-size"]
"auto_recap" = false
screen_reader_detection_done = true
fullscreen_transcript = true

["features"]
"responses_websockets_v2" = true
"terminal_resize_reflow" = true
"memories" = false
"plugin_hooks" = true
"apps" = false
"hooks" = true
"js_repl" = false
"multi_agent" = true
"workspace_dependencies" = false

# [features.rollout_budget]
# enabled = true
# limit_tokens = 300000
# sampling_token_weight = 1.0
# prefill_token_weight = 0.2
# reminder_at_remaining_tokens = [50000, 25000, 10000, 5000]

["features"."multi_agent_v2"]
"enabled" = true
"default_wait_timeout_ms" = 1500000
"max_wait_timeout_ms" = 1500000

["feedback"]
"enabled" = false

["mcp_servers"."openaiDeveloperDocs"]
url = "https://developers.openai.com/mcp"

["notice"]
"hide_rate_limit_model_nudge" = true
"hide_full_access_warning" = true
"fast_default_opt_out" = true

["notice"."model_migrations"]
"gpt-5.4" = "gpt-5.5"
