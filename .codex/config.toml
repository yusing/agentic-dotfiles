"model" = "gpt-6.2-sol"
"model_reasoning_summary" = "auto"
"model_context_window" = 272000
"experimental_compact_prompt_file" = "$HOME/.skills-mgr/skills/handoff/STANDARD.md"
"personality" = "none"
"hide_agent_reasoning" = false
"service_tier" = "default"
"approval_policy" = "on-request"
"approvals_reviewer" = "auto_review"
"model_reasoning_effort" = "medium"
"sandbox_mode" = "danger-full-access"
["analytics"]
"enabled" = false

["memories"]
"use_memories" = false
"generate_memories" = false

["tui"]
"theme" = "catppuccin-mocha"
"status_line_use_colors" = true
"session_picker_view" = "comfortable"
"status_line" = ["model-with-reasoning", "git-branch", "context-used", "fast-mode", "task-progress", "thread-id", "branch-changes", "weekly-limit", "context-window-size"]
"auto_recap" = false
screen_reader_detection_done = true
fullscreen_transcript = true

["tui".presets.2]
input = """
I want you to sweep the target below for removable complexity, overhead, and avoidable failures, then fix what you confirm. Use $commit for all commits.

## Sweep

* Run the sweep through background subagents, split by area or aspect, so they cover the target in parallel while you continue. Brief them with the target and categories, not your suspicions, so their findings stay independent.

* Look for:

  * Dead code: static dead-code analysis plus code reading for unused or unreachable logic.

  * Stale support: legacy, compatibility, and migration code with no remaining consumer, the docs and tests that exist only for it, and leftovers from earlier removals.

  * Slop: what $deslop targets, in implementations and tests.

  * Overhead in every phase the target runs through (such as setup, run, grading, teardown): CPU, memory, allocations, disk, wall time, and repeated work.

  * Avoidable failures: errors that are handled, retried, or masked when their source could be removed.

* Alongside the code, use any evidence sources the target names, such as agent session transcripts or Plane FIXME items.

## Findings

* Confirm each finding against its callers and contracts, and each overhead finding with a measurement or profile. Drop what you cannot confirm.

* In projects tracked in Plane, record each confirmed finding as its own item with $plane. Record findings outside the target in a FIXME item instead of fixing them.

* If the target says read-only, stop after recording and report.

## Fixes

* Resolve every confirmed in-scope finding in this session.

* Remove before optimizing, so no effort goes into code that is about to go.

* Simplify with $deslop.

* Optimize for lower CPU and memory use, fewer allocations, and no repeated work. Fix an error at its source rather than handling it.

* Report before-and-after measurements for each optimization.

## Target

"""
label = "Sweep, deslop, optimize"

["tui".presets.3]
input = """
I want you to diagnose the agent behavior in the evidence below and fix its causes. Use $commit for all commits.

## Diagnose

* Read the named sessions, transcripts, URLs, and reports yourself.

* Trace each symptom, such as stalls, extra requests or tokens, longer wall time, unrequested work, instruction violations, or noisy output, to the cause that produces it: project code, global or project instructions, skills, hooks, or tool output.

* Check other recent sessions for the same causes and for related frictions the evidence did not name.

* Confirm causes with transcript evidence. Keep unconfirmed hypotheses separate.

## Fix

* Fix each confirmed cause at its owner, including preexisting ones, so the symptom cannot recur.

* Record causes outside the target project in a FIXME item.

* Report each symptom with its cause, evidence, and fix.

## Evidence

"""
label = "Diagnose sessions"

["tui".presets.4]
input = """
I want you to review my unpushed work and fix what the review confirms.

* Review unpushed commits and uncommitted changes against their intent through reviewer delegates by role, including slop and unrequested changes.

* Fold each fix into the commit it belongs to as a fixup! or amend! commit with $commit, then autosquash.

* Run the tests the range affects on the final tree.

* Report each finding with its outcome, and the rewritten commit SHAs.

## Focus

"""
label = "Review and fixup unpushed"

["tui".presets.5]
input = """
I want you to refresh the README with $writing-readme. Use $commit for the commit.

* Find what shipped since the README was last updated, including notable additions worth mentioning, and add what readers need from it.

* Remove stale, duplicated, and low-value content. Cleaning up means less: keep the result no longer than before unless new features require it, and report line counts before and after.

## Notes

"""
label = "Refresh README"

["tui".presets.6]
input = """
I want you to review and polish the UI below until it holds up next to mainstream apps. Use $commit for all commits.

* Run the real UI and judge it from the rendered result, not the source.

* Fix the known issues listed below, then sweep every view and state for glitches, inconsistent rendering of the same data across views, unclear labels, misalignment, and wasted space.

* Check the layout on laptop (16") and large desktop (27"+) screens, plus any other sizes listed below.

* Get an independent UI review of the final rendered result and resolve its findings.

* Report each fix with before and after screenshots.

## Known issues

"""
label = "UI review pass"

["tui".presets.7]
input = "Review every PR, explain each: what it was trying to solve, what was the design choice, what was the approach, whether the PR is implemented correctly (correct approach and correct code), whether it is merge ready."
label = "Review and Explain PRs"

["tui".presets.8]
input = "Work independently and cherry pick back with new worktree removed and issue closed."
label = "Independent work"

["features"]
"responses_websockets_v2" = true
"terminal_resize_reflow" = true
"memories" = false
"plugin_hooks" = true
"apps" = false
"hooks" = true
"workspace_dependencies" = false

["features"."multi_agent_v2"]
"enabled" = true
"max_concurrent_threads_per_session" = 9

["feedback"]
"enabled" = false

["mcp_servers"."openaiDeveloperDocs"]
url = "https://developers.openai.com/mcp"

["notice"]
"hide_rate_limit_model_nudge" = true
"hide_full_access_warning" = true
"fast_default_opt_out" = true
