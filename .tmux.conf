unbind C-b
set-option -g prefix C-s
bind C-s send-prefix

# DCS passthrough
set -g allow-passthrough on
set -g extended-keys on

# set window index starts from 0
set -g base-index 1
setw -g pane-base-index 1

# renumber when window is closed
set -g renumber-window on

# increase history size
set -g history-limit 10000

# -- urlscan -------------------------------------------------------------------

# options passed to urlscan
tmux_conf_urlscan_options="--compact --dedupe"

# -- clipboard -----------------------------------------------------------------

# in copy mode, copying selection also copies to the OS clipboard
#   - true
#   - false (default)
#   - disabled
# on Linux, this requires xsel, xclip or wl-copy
tmux_conf_copy_to_os_clipboard=true
set -s set-clipboard on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# don't rename windows automatically
# set-option -g allow-rename off

# color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ',tmux-256color*:RGB'

# copy mode
# setw -g mode-style 'fg=black bg=red bold'

# catppuccin
# Configure the catppuccin plugin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
set -g @catppuccin_window_default_text '#W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text '#W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text '%d.%m. %H:%M'
set -g @catppuccin_status_module_text_bg '#{E:@thm_mantle}'

# Make the status line pretty and add some modules
set -g allow-rename off
set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# Apply directly to status-right
set -gF status-right "#{E:@catppuccin_status_application}"

# CPU (Label removed, padding added)
set -ag status-right "#[fg=#{E:@thm_teal},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@thm_teal}] #[fg=#{E:@thm_text},bg=#{E:@thm_mantle}] #{cpu_percentage} #[fg=#{E:@thm_mantle},bg=default] "

# RAM (Label removed, padding added)
set -ag status-right "#[fg=#{E:@thm_sky},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@thm_sky}] #[fg=#{E:@thm_text},bg=#{E:@thm_mantle}] #{ram_percentage} #[fg=#{E:@thm_mantle},bg=default] "

# Network (Label removed, padding added)
set -ag status-right "#[fg=#{E:@thm_green},bg=default]#[fg=#{E:@thm_crust},bg=#{E:@thm_green}]󰤨 #[fg=#{E:@thm_text},bg=#{E:@thm_mantle}] #{net_speed} #[fg=#{E:@thm_mantle},bg=default] "

set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right '#{E:@catppuccin_status_date_time}'

# -- network speed -------------------------------------------------------------
set -g @net_speed_interfaces "eth1" 
set -g @net_speed_format "↓ %s ↑ %s" # Using arrows instead of text labels

# Enable mouse control (clickable windows, panes, resizable panes)
set -g @yank_selection_mouse 'clipboard'
set -g mouse on

# -- session navigation sidebar ------------------------------------------------

unbind-key Tab
# Open left sidebar with fzf, programmatically pre-selecting the current session/window
bind-key Tab display-popup -E -w 30 -h 100% -x 0 -y 0 "bash -c 'LIST=\$(tmux list-windows -a -F \"#S:#I #W\"); CURRENT=\$(tmux display-message -p \"#S:#I #W\"); INDEX=\$(echo \"\$LIST\" | grep -nxF \"\$CURRENT\" | cut -d: -f1); echo \"\$LIST\" | fzf --reverse --prompt=\"Jump> \" --bind=\"load:pos(\${INDEX:-1})\" | cut -d\" \" -f1 | xargs -I {} tmux switch-client -t \"{}\"'"

# plugins
tmux_conf_update_plugins_on_launch=true
tmux_conf_update_plugins_on_reload=true
tmux_conf_uninstall_plugins_on_reload=true

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'azorng/tmux-smooth-scroll'

# source -F '~/custom_modules/ctp_cpu.conf'
# source -F '~/custom_modules/ctp_memory.conf'
# source -F '~/custom_modules/primary_ip.conf'

set -g @plugin 'tmux-plugins/tmux-yank'
# set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
