# Generated by setup.sh from setup.json. Edit setup.json, not this file.

[settings]
"lockfile" = true
"minimum_release_age" = "0s"
"npm" = { "package_manager" = "bun" }
"go" = { "set_gobin" = false }

[tools]
"github:lightpanda-io/browser" = { "version" = "1.0.0", "matching_regex" = "^lightpanda-(aarch64|x86_64)-(linux|macos)$", "bin" = "lightpanda" }
"npm:@kilocode/cli" = "latest"
"npm:@tailwindcss/cli" = "latest"
"npm:@trunkio/launcher" = "latest"
"npm:agent-browser" = "latest"
"npm:markdownlint-cli" = "latest"
"npm:ccstatusline" = "latest"
"npm:ctx7" = "latest"
"npm:oxlint-tsgolint" = "latest"
"npm:pyright" = "latest"
"npm:scriptc" = { "version" = "0.2.6", "postinstall" = "cd \"$MISE_TOOL_INSTALL_PATH\" && bun pm trust scriptc" }
"npm:vite" = "latest"
"aqua:go-swagger/go-swagger" = "latest"
"github:dlvhdr/gh-dash" = { "version" = "latest", "bin" = "gh-dash", "matching_regex" = "^gh-dash_.*_(linux|darwin)-(amd64|arm64)$" }
"github:tonistiigi/binfmt" = { "version" = "latest", "os" = ["linux"], "version_prefix" = "deploy/v", "matching_regex" = "^binfmt_linux-(amd64|arm64)\\.tar\\.gz$", "bin" = "binfmt" }
"go:golang.org/x/tools/cmd/deadcode" = "latest"
"go:github.com/yusing/skills-mgr" = "latest"
"go:github.com/yusing/git-agent/cmd/git-agent" = "latest"
"go:github.com/yusing/shadowtree/cmd/shadowtree" = "latest"
"go:github.com/yusing/shadowtree/cmd/shadowtree-lsp" = "latest"
"go:github.com/icholy/gomajor" = "latest"
