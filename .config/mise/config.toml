# Generated by setup.sh from setup.json. Edit setup.json, not this file.

[settings]
"lockfile" = true
"minimum_release_age" = "0s"
"npm" = { "package_manager" = "bun" }
"go" = { "set_gobin" = false }

[tools]
"go" = "latest"
"bun" = "latest"
"node" = "latest"
"github:fish-shell/fish-shell" = { "version" = "latest", "os" = ["linux"], "matching_regex" = "^fish-.*-linux-(x86_64|aarch64)\\.tar\\.xz$" }
"github:aristocratos/btop" = { "version" = "latest", "os" = ["linux"], "matching_regex" = "^btop-(x86_64|aarch64)-unknown-linux-musl\\.tar\\.gz$", "strip_components" = 1, "bin_path" = "bin", "postinstall" = "mkdir -p \"$MISE_TOOL_INSTALL_PATH/share/btop\" && ln -s ../../themes \"$MISE_TOOL_INSTALL_PATH/share/btop/themes\"" }
"python" = "latest"
"github:microsoft/TypeScript" = { "version" = "latest", "matching_regex" = "^typescript-(linux|darwin|win32)-", "strip_components" = 1, "bin_path" = "lib" }
"github:llvm/llvm-project" = { "version" = "latest", "os" = ["linux"], "version_prefix" = "llvmorg-", "matching_regex" = "^LLVM-.*-Linux-(X64|ARM64)\\.tar\\.xz$", "strip_components" = 1, "bin_path" = "bin" }
"pipx:rich-cli" = { "version" = "latest", "uvx" = true }
"pipx:yamllint" = { "version" = "latest", "uvx" = true }
"pipx:semgrep" = { "version" = "latest", "uvx" = true }
"github:vi/websocat" = { "version" = "latest", "bin" = "websocat" }
