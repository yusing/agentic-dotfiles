name: Linux tool image base

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  base:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish prerequisite base
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .local/lib/tool-image/base.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agentic-tools-container:base-${{ github.run_id }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: false
      - name: Report immutable base reference
        env:
          BASE_IMAGE: ghcr.io/${{ github.repository_owner }}/agentic-tools-container@${{ steps.image.outputs.digest }}
        run: |
          echo "$BASE_IMAGE"
          printf 'Pinned multi-architecture prerequisite base: %s\n' "$BASE_IMAGE" >> "$GITHUB_STEP_SUMMARY"
